          - entity: sensor.judo_isoft_pro_192_168_176_2_weichwassermenge
            name: Weichwassermenge
          - entity: sensor.judo_isoft_pro_192_168_176_2_aktueller_wasserdurchfluss
            name: Wasserdurchfluss
          - entity: sensor.judo_isoft_pro_192_168_176_2_wassertemperatur
            name: Wassertemperatur
          - entity: sensor.judo_isoft_pro_192_168_176_2_aktive_szene
            name: Aktive Szene
          - entity: sensor.judo_isoft_pro_192_168_176_2_leckageschutz_status
